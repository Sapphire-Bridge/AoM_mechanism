name: archival-structural

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release-prep
      - archival-hardening

jobs:
  structural-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check
        run: make check PYTHON=python3.11
      - name: Archival structural check
        run: make archival-check PYTHON=python3.11 ARCHIVAL_CHECK_ARGS="--skip_pytest --skip_readme_verifier"
