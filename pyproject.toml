[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aom-mechanism"
version = "1.0.4"
description = "Paper-reproducible mechanistic interpretability pipeline for the Mechanics of Meaning (MoM) paper."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Felix Borck" }
]
keywords = [
  "mechanistic-interpretability",
  "transformers",
  "sparse-autoencoders",
  "activation-patching",
  "causal-interventions",
  "reproducibility",
  "research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Public environment management for the paper/reviewer path is intentionally
# driven via requirements.txt and Make targets rather than pip install .
dependencies = []

[project.urls]
Repository = "https://github.com/sapphire-bridge/AoM_mechanism"
Documentation = "https://github.com/sapphire-bridge/AoM_mechanism#readme"
Issues = "https://github.com/sapphire-bridge/AoM_mechanism/issues"

[tool.setuptools]
packages = ["aom"]
