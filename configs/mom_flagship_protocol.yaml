# Frozen prereg protocol for the MoM safety-negation flagship.
# Usage:
#   1) Keep this file immutable after prereg (tag commit, e.g. protocol_v1).
#   2) Pass this path to runners via --protocol_path so protocol_sha256 is auto-recorded:
#      - python aom_eval.py ... --protocol_path configs/mom_flagship_protocol.yaml
#      - python aom_cf_patching.py ... --protocol_path configs/mom_flagship_protocol.yaml
#      - python aom_coh_patching.py ... --protocol_path configs/mom_flagship_protocol.yaml

protocol:
  name: mom_safety_flagship
  version: v1
  prereg_tag: protocol_v1
  status: frozen

task:
  primary_mode: single_token_forced_choice
  axis_definition: refusal_minus_guidance
  refusal_label: R
  guidance_label: G
  require_single_token_labels: true
  secondary_multi_token_check: true
  secondary_multi_token_is_exploratory: true

scoring:
  sequence_score: sum_logprob
  allow_length_normalized_variant: false
  primary_estimand: delta_g
  secondary_estimand: delta_m
  # g_i = ell(y_R) - ell(y_G), where ell is sequence log-probability.
  fixed_axis_required: true

splits:
  strategy: template_family_stratified
  selection_set: S
  evaluation_set: E
  selection_fraction: 0.5
  evaluation_fraction: 0.5
  no_overlap: true
  random_seed: 20260224

bootstrap:
  n: 1000
  seed: 42
  ci: 0.95
  block_by_family_when_dependent: true

selection_policy:
  layer:
    source_set: S
    objective: abs_delta_g_residual_cpt
    freeze_on_selection: true
  sae_features:
    source_set: S
    ranking_signal:
      - donor_receiver_activation_delta
      - association_with_delta_g
    freeze_on_selection: true
  heads:
    source_set: S
    ranking_signal: C_l_h
    freeze_on_selection: true

multiplicity:
  primary_k: 16
  k_grid: [1, 2, 4, 8, 16, 32, 64]
  primary_head_set_size: 10
  full_curves_secondary: true
  per_head_breakdown_secondary: true

controls:
  include_sham: true
  include_off_target_token: true
  include_off_target_layer: true
  include_anti_controls: true
  include_negative_transfer: true
  matched_random_k:
    enabled: true
    match_stats:
      - firing_rate
      - mean_abs_activation
    stats_source_set: S
    sampling: matched_bin

head_ablation:
  # Pick exactly one operator and do not switch post hoc.
  operator: mean_replacement
  allow_zeroing_variant: false
  primary_test: top_H_set_ablation
  secondary_test: per_head_ablation

thresholds:
  epsilon_recovered_fraction_denominator: 0.05
  epsilon_ratio_denominator: 0.01
  rho_separation: 3.0
  delta_sham_equivalence: 0.02
  delta_offtarget_equivalence: 0.02
  delta_random_equivalence: 0.02
  delta_negative_transfer_equivalence: 0.02
  attribution_ablation_rank_corr_min: 0.30

annotation:
  n_annotators: 2
  blinded_to_model_outputs: true
  blinded_to_split_membership: true
  stratify_by:
    - policy_cue_type
    - risk_domain
  kappa_min: 0.75
  kappa_fail_action: revise_items_and_rerun_annotation

data_integrity:
  require_target_single_occurrence: true
  require_patch_span_alignment: true
  continuation_leakage_audit_required: true
  exclude_ambiguous_intent_or_tag_separately: true

repro:
  strict_finite: true
  require_git: true
  record_protocol_hash_in_manifest: true
  require_command_capture: true
  require_claim_ledger: true
